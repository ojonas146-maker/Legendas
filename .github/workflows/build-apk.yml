name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK e CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Keystore de teste
        run: keytool -genkeypair -keystore app/legendas.jks -storepass legendas -keypass legendas -alias legendas -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Legendas"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Legendas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Legendas-apk
          path: Legendas.apk
      - name: Publicar (link fixo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Legendas (último build)
          files: Legendas.apk
